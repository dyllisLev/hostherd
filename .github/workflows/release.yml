name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - name: Image name
        # GHCR names must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hostherd" >> "$GITHUB_ENV"

      - name: Check the signing key secret
        env:
          AGENT_SIGNING_KEY_B64: ${{ secrets.AGENT_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$AGENT_SIGNING_KEY_B64" ]; then
            echo "Repository secret AGENT_SIGNING_KEY_B64 is not set"; exit 1
          fi

      # Every RUN step in the Dockerfile executes on the runner's own platform,
      # so the arm64 image needs no QEMU emulation.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Hostherd
            org.opencontainers.image.licenses=Elastic-2.0
          annotations: |
            org.opencontainers.image.title=Hostherd
            org.opencontainers.image.licenses=Elastic-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          secrets: |
            AGENT_SIGNING_KEY_B64=${{ secrets.AGENT_SIGNING_KEY_B64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
